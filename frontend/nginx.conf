# Serves the built SPA and reverse-proxies /api to Django, so the browser sees one origin.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
  listen 8080;
  server_tokens off;
  client_max_body_size 6m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

  location = /healthz { access_log off; return 200 "ok"; }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    # Own header set (stops inheriting the SPA CSP) so Swagger UI works through the proxy.
    add_header X-Content-Type-Options nosniff always;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
