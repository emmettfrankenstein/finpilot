name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrate, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finpilot
          POSTGRES_USER: finpilot
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finpilot" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DB: finpilot
      POSTGRES_USER: finpilot
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-secret-key
      LOG_LEVEL: WARNING
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are complete and apply to a clean database
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file openapi.yaml
      - name: Seed supplied data (idempotent)
        run: |
          python manage.py seed_data --data-dir ../data
          python manage.py seed_data --data-dir ../data
      - name: Tests
        run: pytest
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.yaml

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Dependency and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependency audit
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
      - name: Smoke test the full stack
        run: |
          docker compose up -d
          for i in $(seq 1 40); do curl -fsS http://localhost:8080/api/v1/health && break; sleep 3; done
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - if: always()
        run: docker compose logs api | tail -50 && docker compose down -v
