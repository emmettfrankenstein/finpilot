# One-command local stack: docker compose up --build
#   web  http://localhost:8080        (React build served by nginx, proxies /api)
#   api  http://localhost:8000/api/v1 (Swagger UI at /api/v1/docs)
#   db   localhost:5432               (PostgreSQL 16, data in the pgdata volume)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finpilot}
      POSTGRES_USER: ${POSTGRES_USER:-finpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      SEED_DATA_DIR: /data
    volumes: ["./data:/data:ro"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
